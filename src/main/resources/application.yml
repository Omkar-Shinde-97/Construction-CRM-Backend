spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/buildcrm
    username: buildcrm
    password: buildcrm
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc.lob.non_contextual_creation: true
      javax.persistence.validation.mode: auto
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: caffeine
  h2:
    console:
      enabled: true
      path: /h2-console
app:
  jwt:
    secret: R3Zq8sX9kF1uM6pN2rT5wZ8vC4yB7hJ0LzQ2xS6dV9bN3mP8
    access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 604800000
  storage:
    type: local
    local:
      upload-dir: uploads
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
server:
  port: 8080
logging:
  level:
    org.springframework: INFO
    com.buildcrm: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
